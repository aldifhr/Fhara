name: CI

# Fhara CI: install, typecheck the server, web, desktop and the packages they use, then lint.
# No installer is built and no release runs here.
# Upstream T3 Code ran on Blacksmith runners with desktop, mobile and release jobs;
# mobile, marketing and release jobs were removed.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # One package at a time keeps peak memory low. `typecheck` in each package (and the
      # web app's Vite+ task) is this same command.
      - name: Typecheck
        run: |
          set -e
          tsgo="$PWD/node_modules/.bin/effect-tsgo"
          for dir in packages/contracts packages/shared packages/provider-core packages/effect-acp packages/effect-codex-app-server packages/provider-acp packages/provider-acp-registry packages/provider-opencode packages/provider-testing packages/source-control-core packages/source-control-github packages/source-control-testing packages/source-control-definitions packages/secret-provider-core packages/secret-provider-onepassword packages/secret-provider-definitions packages/ssh packages/tailscale packages/client-runtime apps/server apps/web apps/desktop; do
            echo "::group::$dir"
            (cd "$dir" && "$tsgo" tsrs --noEmit)
            echo "::endgroup::"
          done

      - name: Lint
        run: vp lint --report-unused-disable-directives
